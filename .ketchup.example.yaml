version: 1

project:
  name: example

# Catch-up controls what you see when running `ketchup catch-up`
catchup:
  show: relevant      # relevant | all
  explain: false      # include scores and scoring breakdown
  max_relevant: 10    # cap relevant items (0 = no limit)

providers:
  git:
    enabled: true
    strategy: fast-forward-only

  dependencies:
    enabled: true
    auto_install: true

  env:
    enabled: true
    source: .env.example
    target: .env
